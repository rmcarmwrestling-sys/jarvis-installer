name: Build Jarvis Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK firmado para distribución
        id: build_apk
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace -p android assembleRelease 2>&1 | tee android-build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Guardar registro de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-build-log
          path: android-build.log
          if-no-files-found: error

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publicar APK en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.2
          name: Jarvis Android v1.8.2
          body: |-
            Aplicación Android nativa de Jarvis.

            Instálala en un teléfono Android y abre Jarvis directamente, sin pasar por la página de distribución.
            Incluye Study completo, adjuntos de imágenes y vídeos, selector nativo de cuentas Google, menú lateral móvil, barra segura bajo la barra de estado e IA local en Android mediante llama.cpp.
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
