plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

android {
    namespace 'com.jarvis.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jarvis.android'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
