plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jarvis.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jarvis.android'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
